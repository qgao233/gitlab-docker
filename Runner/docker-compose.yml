version: '3.8'

services:
  gitlab-runner:
    image: 'docker.1ms.run/gitlab/gitlab-runner:v15.11.1'
    container_name: gitlab-runner
    restart: always
    volumes:
      # Runner 配置
      - './config:/etc/gitlab-runner'
      # Docker socket（用于 docker executor）
      - '/var/run/docker.sock:/var/run/docker.sock'
    environment:
      - TZ=Asia/Shanghai
    # 添加 hosts 映射
    extra_hosts:
      - "gitlab.yfpo.com:10.252.4.135"
    # Runner 进程本身很轻，1–2G 足够；deploy.resources 在非 Swarm 下常不生效，用 mem_limit
    mem_limit: 2g
    mem_reservation: 512m
    # 如果需要与 GitLab 在同一网络，取消下面注释
    # networks:
    #   - gitlab_network

# 外部网络配置（需要先创建：docker network create gitlab_network）
# networks:
#   gitlab_network:
#     external: true
#     name: gitlab_network
